name: Memecoin Radar
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      initialize:
        description: 'Apenas primeira execução: criar estado cifrado se ainda não existe'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: radar-persistent-state
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Testes essenciais (sem rede)
        run: python -m unittest discover -s tests -v
      - name: Verificar mercado, processar comandos e guardar estado
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          RADAR_STATE_KEY: ${{ secrets.RADAR_STATE_KEY }}
          RADAR_INITIALIZE: ${{ inputs.initialize && 'true' || 'false' }}
        run: python -m radar.cloud
